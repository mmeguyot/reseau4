<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Je m'entraîne : le réseau — 4e</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono&display=swap');
:root{--blue:#2563eb;--violet:#7c3aed;--lblue:#eff6ff;--lviolet:#f5f3ff;--text:#1e293b;--grey:#64748b;--border:#e2e8f0;
--ok:#16a34a;--lok:#f0fdf4;--ko:#dc2626;--lko:#fef2f2;--teal:#0d9488;--orange:#ea580c}
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;font-family:Nunito,sans-serif;color:var(--text);font-size:18px}
.wrap{max-width:820px;margin:24px auto;background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(15,23,42,.08);padding:26px 34px 18px;min-height:560px;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:4px solid var(--blue);padding-bottom:10px;margin-bottom:18px}
h1{margin:0;font-size:30px;font-weight:900;color:var(--blue)}
.sub{margin:4px 0 0;font-weight:700;color:var(--violet);font-size:18px}
.niv{font-family:'Space Mono',monospace;color:var(--grey);font-size:13px;text-align:right}
main{flex:1}
footer{font-family:'Space Mono',monospace;font-size:12px;color:var(--grey);border-top:1px solid var(--border);padding-top:8px;margin-top:18px;display:flex;justify-content:space-between}
/* accueil */
.intro{font-weight:700;color:var(--grey);margin:0 0 16px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.theme{border:3px solid;border-radius:18px;padding:16px 18px;cursor:pointer;background:#fff;text-align:left;font-family:inherit;color:var(--text);transition:transform .12s}
.theme:hover{transform:translateY(-2px)}
.theme .t{font-size:22px;font-weight:900;display:block}
.theme .d{font-size:15px;font-weight:700;color:var(--grey);display:block;margin-top:4px}
.theme .best{font-size:14px;font-weight:800;display:block;margin-top:8px}
.th-comp{border-color:var(--blue)} .th-comp .t,.th-comp .best{color:var(--blue)}
.th-peri{border-color:var(--violet)} .th-peri .t,.th-peri .best{color:var(--violet)}
.th-conn{border-color:var(--teal)} .th-conn .t,.th-conn .best{color:var(--teal)}
.th-all{grid-column:1/-1;border-color:var(--orange)} .th-all .t,.th-all .best{color:var(--orange)}
/* question */
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.prog{flex:1;height:14px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:99px;transition:width .3s}
.count{font-weight:900;color:var(--grey);font-size:16px;white-space:nowrap}
.stars{font-weight:900;color:var(--orange);white-space:nowrap}
.qcard{border:2px solid var(--border);border-radius:18px;padding:18px 20px}
.qtxt{font-size:23px;font-weight:900;margin:0 0 12px}
.visu{display:flex;justify-content:center;margin:4px 0 14px}
.visu img{max-height:190px;max-width:100%;border-radius:10px}
.visu svg{width:260px;height:auto}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.one{grid-template-columns:1fr}
.ch{font-family:inherit;font-size:19px;font-weight:800;color:var(--text);background:var(--lblue);border:2.5px solid var(--blue);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;transition:transform .1s}
.ch:hover:not(:disabled){transform:translateY(-1px);background:#dbeafe}
.ch:disabled{cursor:default}
.ch.good{background:var(--lok);border-color:var(--ok);color:var(--ok)}
.ch.bad{background:var(--lko);border-color:var(--ko);color:var(--ko)}
.ch.dim{opacity:.55}
.fb{margin-top:14px;border-radius:14px;padding:12px 16px;font-weight:700;display:none}
.fb.ok{display:block;background:var(--lok);border:2px solid var(--ok)}
.fb.ko{display:block;background:var(--lko);border:2px solid var(--ko)}
.fb b{font-weight:900}
.fb.ok b{color:var(--ok)} .fb.ko b{color:var(--ko)}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{font-family:inherit;font-weight:900;font-size:17px;border:none;border-radius:99px;padding:10px 22px;cursor:pointer;color:#fff;background:var(--violet)}
.btn:hover{filter:brightness(1.08)}
.btn.blue{background:var(--blue)} .btn.grey{background:var(--grey)}
.btn[hidden]{display:none}
/* fin */
.end{text-align:center}
.big{font-size:56px;font-weight:900;color:var(--blue);margin:6px 0}
.msg{font-size:22px;font-weight:900;margin:0 0 6px}
.revoir{text-align:left;border:2px solid var(--border);border-radius:16px;padding:12px 18px;margin:16px 0}
.revoir h3{margin:0 0 6px;color:var(--ko);font-size:18px}
.revoir li{margin:6px 0;font-weight:700}
.revoir li span{color:var(--ok);font-weight:900}
.confetti{font-size:40px}

.th-bin{border-color:var(--teal)} .th-bin .t,.th-bin .best{color:var(--teal)}
.th-com{border-color:var(--violet)} .th-com .t,.th-com .best{color:var(--violet)}
.th-atel{grid-column:1/-1;border-color:var(--grey);border-style:dashed} .th-atel .t{color:var(--text)}
.mono{font-family:'Space Mono',monospace;font-weight:700}
.bigbits{font-family:'Space Mono',monospace;font-size:34px;font-weight:700;letter-spacing:6px;text-align:center;margin:4px 0 10px;color:var(--teal)}
.bigip{font-family:'Space Mono',monospace;font-size:30px;font-weight:700;text-align:center;margin:4px 0 10px;color:var(--blue)}
.octet{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:560px;margin:6px auto 4px}
.octet .w{text-align:center;font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--teal);background:#f0fdfa;border-radius:6px;padding:2px 0}
.octet button{height:56px;border-radius:10px;border:2.5px solid var(--border);background:#fff;font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:var(--grey);cursor:pointer}
.octet button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.octet button:disabled{cursor:default}
.octet button.good{outline:3px solid var(--ok);outline-offset:2px}
.octet button.bad{outline:3px solid var(--ko);outline-offset:2px}
.tot{text-align:center;font-weight:900;font-size:20px;margin:6px 0 2px}
.tot span{font-family:'Space Mono',monospace;color:var(--teal);font-size:26px}
.atel-in{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px 0 4px;flex-wrap:wrap;font-weight:800}
.atel-in input{font-family:'Space Mono',monospace;font-size:22px;width:110px;padding:6px 10px;border:2.5px solid var(--border);border-radius:10px;text-align:center}
.calc{text-align:center;color:var(--grey);font-weight:700;min-height:26px}
.dstat{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.dstat span{background:#f1f5f9;border-radius:99px;padding:5px 14px;font-weight:900;font-size:16px}
.dstat .lv{background:#f0fdfa;color:var(--teal)} .dstat .st{background:#fff7ed;color:var(--orange)} .dstat .ti{background:#fef2f2;color:var(--ko)}
.tabbtn{display:block;margin:0 auto 8px;font-family:inherit;font-weight:900;font-size:15px;border:2px dashed var(--teal);background:#f0fdfa;color:var(--teal);border-radius:99px;padding:6px 16px;cursor:pointer}
table.conv{border-collapse:separate;border-spacing:4px;margin:0 auto 10px}
table.conv th,table.conv td{min-width:52px;text-align:center;font-family:'Space Mono',monospace;font-weight:700;border-radius:8px;padding:6px 4px}
table.conv th{background:#f0fdfa;color:var(--teal);font-size:15px}
table.conv td{background:#f8fafc;border:2px solid var(--border);font-size:22px;color:var(--grey)}
table.conv td.one{background:var(--teal);border-color:var(--teal);color:#fff}
table.conv td.scr{cursor:pointer}
table.conv .lab{background:none;border:none;font-family:Nunito,sans-serif;font-size:13px;color:var(--grey);min-width:0;text-align:right}
.lvup{text-align:center;font-weight:900;color:var(--teal);font-size:20px;margin-top:8px}
</style></head>

<main id="main"></main>
<footer><span>Le réseau informatique · entraînement</span><span>autant de fois que tu veux !</span></footer>

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const bin=n=>n.toString(2).padStart(8,"0");
const decomp=n=>{const p=W.filter(w=>n&w);return p.length?p.join(" + "):"0";};
function best(t){try{return +localStorage.getItem("reseau4e-best-"+t)||0;}catch(e){return 0;}}
function saveBest(t,v){try{if(v>best(t))localStorage.setItem("reseau4e-best-"+t,v);}catch(e){}}
function uniq(a,c,gen){const s=new Set([a]);const out=[a];for(const x of c){if(out.length>=4)break;if(!s.has(x)){s.add(x);out.push(x);}}let k=0;while(out.length<4&&k<50){const x=gen();k++;if(!s.has(x)){s.add(x);out.push(x);}}return out;}
// ----- questions de binaire générées -----
function genBin(kind){
  const n=rnd(3,250), b=bin(n);
  if(kind==="b2d"){
    const rev=parseInt(b.split("").reverse().join(""),2), ones=(b.match(/1/g)||[]).length;
    const c=uniq(String(n),[String(rev),String(ones),String(Math.min(255,n+W[rnd(4,7)]))],()=>String(rnd(1,255)));
    return {th:"bin",q:"Quelle est la valeur en décimal de cet octet ?",big:b,a:String(n),c:c,ex:`On additionne les poids des bits à 1 : ${b} = ${decomp(n)} = ${n}.`};
  }
  if(kind==="d2b"){
    const c=uniq(b,[b.split("").reverse().join(""),bin(Math.min(255,n+1)),bin(n^W[rnd(0,3)])],()=>bin(rnd(1,255)));
    return {th:"bin",q:`Comment s'écrit ${n} en binaire ?`,a:b,c:c,mono:1,ex:`${n} = ${decomp(n)} → on met à 1 les bits de ces poids : ${b}.`};
  }
  if(kind==="click"){ const t=rnd(5,250); return {th:"bin",type:"click",q:`Clique sur les bits pour écrire le nombre ${t} en binaire.`,target:t,a:bin(t),ex:`${t} = ${decomp(t)} → ${bin(t)}.`}; }
  if(kind==="poss"){ const k=rnd(1,8), p=2**k; const c=uniq(String(p),[String(2*k),String(p-1),String(k*k)],()=>String(rnd(2,300)));
    return {th:"bin",q:`Avec ${k} bit${k>1?"s":""}, combien de possibilités différentes ?`,a:String(p),c:c,ex:`Chaque bit ajouté double le nombre de possibilités : ${k} bit${k>1?"s":""} → ${Array(k).fill(2).join(" × ")} = ${p}.`}; }
  if(kind==="max"){ const k=rnd(2,8), m=2**k-1; const c=uniq(String(m),[String(2**k),String(k),String(2*k)],()=>String(rnd(2,300)));
    return {th:"bin",q:`Avec ${k} bits, quel est le plus grand nombre que l'on peut écrire ?`,a:String(m),c:c,ex:`Tous les bits à 1 : ${"1".repeat(k)} = ${m}. On a ${2**k} possibilités, de 0 à ${m}.`}; }
  const base=[
   {q:"Un bit, c'est…",a:"0 ou 1",c:["0 ou 1","8 chiffres","un nombre de 0 à 255","une lettre"],ex:"Le bit est la plus petite information : 0 ou 1. Il a 2 possibilités."},
   {q:"Un octet, c'est…",a:"8 bits",c:["8 bits","2 bits","10 bits","255 bits"],ex:"1 octet = 8 bits → 2×2×2×2×2×2×2×2 = 256 possibilités."},
   {q:"Combien de possibilités avec un octet ?",a:"256",c:["256","255","8","16"],ex:"8 bits → 2⁸ = 256 possibilités : les nombres de 0 à 255."},
   {q:"Pourquoi 256 possibilités mais un maximum de 255 ?",a:"Parce qu'on compte aussi le 0.",c:["Parce qu'on compte aussi le 0.","Parce que 256 n'existe pas.","C'est une erreur.","Parce qu'il y a 255 bits."],ex:"De 0 à 255, il y a 256 nombres : 00000000 = 0 … 11111111 = 255."}];
  const x=base[rnd(0,base.length-1)]; return Object.assign({th:"bin"},x);
}
function qkey(q){ const m=q.q.match(/\d+/g); return q.big||(q.target!=null?bin(q.target):null)||(q.mono?q.a:null)||q.q; }
function binSerie(n){
  const kinds=shuffle(["b2d","b2d","b2d","click","click","click","d2b","poss","max","base"]).slice(0,n);
  const seenNum=new Set(), seenQ=new Set(), out=[];
  for(const k of kinds){
    let q,tries=0;
    do{ q=genBin(k); tries++; }
    while(tries<200 && (seenQ.has(q.q+"|"+(q.big||"")) || (["b2d","d2b","click"].includes(k) && seenNum.has(qkey(q)))));
    seenQ.add(q.q+"|"+(q.big||"")); if(["b2d","d2b","click"].includes(k)) seenNum.add(qkey(q));
    out.push(q);
  }
  return out;
}
function home(){
  main.innerHTML=`<p class="intro">Choisis un thème. Tu as ${N} questions à chaque fois, et des questions différentes à chaque partie. Entraîne-toi autant que tu veux !</p>
  <div class="themes">${Object.entries(THEMES).map(([k,v])=>`<button class="theme ${v.cls}" data-t="${k}"><span class="t">${v.t}</span><span class="d">${v.d}</span>
  <span class="best">${best(k)?"⭐ Ton record : "+best(k)+" / "+N:"Pas encore joué"}</span></button>`).join("")}
  <button class="theme th-atel" data-t="atelier"><span class="t">🧮 L'atelier binaire</span><span class="d">Convertisseur libre et défis : binaire → décimal, décimal → binaire, contre-la-montre</span></button></div>`;
  main.querySelectorAll(".theme").forEach(b=>b.onclick=()=>b.dataset.t==="atelier"?atelierMenu():start(b.dataset.t));
}
function start(t){
  theme=t;idx=0;score=0;rates=[];
  if(t==="bin") serie=binSerie(N);
  else if(t==="all") serie=shuffle(shuffle(Q).slice(0,7).concat(binSerie(3)));
  else serie=shuffle(Q.filter(q=>q.th===t)).slice(0,N);
  show();
}

function bindOctet(el,onch){const bs=[...el.querySelectorAll("button")];bs.forEach(b=>b.onclick=()=>{b.classList.toggle("on");b.textContent=b.classList.contains("on")?"1":"0";onch(val(bs));});return bs;}
function val(bs){return bs.reduce((s,b,i)=>s+(b.classList.contains("on")?W[i]:0),0);}
function setOctet(bs,n){bs.forEach((b,i)=>{const on=!!(n&W[i]);b.classList.toggle("on",on);b.textContent=on?"1":"0";});}
function show(){
  const q=serie[idx];
  let visu="";
  if(q.img) visu=`<div class="visu"><img src="${IMG[q.img]}" alt=""></div>`;
  if(q.big) visu=`<div class="bigbits">${q.big}</div>`+(q.th==="bin"?convTab(q.big):"");
  if(q.th==="bin" && q.mono) visu+=convTab(null);
  if(q.bigip) visu=`<div class="bigip">${q.bigip}</div>`;
  let body;
  if(q.type==="click"){
    body=`${octetHTML("oc")}<div class="tot">Ton octet vaut : <span id="tv">0</span></div><div class="btns" style="justify-content:center"><button class="btn blue" id="valider">Valider</button></div>`;
  } else {
    const choices=shuffle(q.c);
    body=`<div class="choices ${choices.length<=2||choices.some(c=>c.length>28)?"one":""}">${choices.map(c=>`<button class="ch${q.mono?" mono":""}">${c}</button>`).join("")}</div>`;
  }
  main.innerHTML=`
  <div class="top"><span class="count">Question ${idx+1} / ${serie.length}</span><div class="prog"><i style="width:${idx/serie.length*100}%"></i></div><span class="stars">⭐ ${score}</span></div>
  <div class="qcard"><p class="qtxt">${q.q}</p>${visu}${body}<div class="fb" id="fb"></div></div>
  <div class="btns"><button class="btn grey" id="quit">⟵ Thèmes</button><button class="btn" id="next" hidden>${idx+1<serie.length?"Question suivante ➜":"Voir mon résultat ➜"}</button></div>`;
  bindTab(main);
  if(q.type==="click"){
    const bs=bindOctet(document.getElementById("oc"),v=>document.getElementById("tv").textContent=v);
    document.getElementById("valider").onclick=()=>answerClick(q,bs);
  } else main.querySelectorAll(".ch").forEach(b=>b.onclick=()=>answer(b,q));
  document.getElementById("quit").onclick=home;
  document.getElementById("next").onclick=()=>{idx++;idx<serie.length?show():end();};
}
let showTab=false;
function convTab(bits){
  const row=bits? bits.split("").map(b=>`<td class="${b==="1"?"one":""}">${b}</td>`).join("") : W.map(()=>`<td class="scr">0</td>`).join("");
  return `<button class="tabbtn" type="button">📋 ${showTab?"Masquer":"Afficher"} le tableau de conversion</button>
   <div class="tabwrap" ${showTab?"":"hidden"}><table class="conv"><tr><th class="lab">poids</th>${W.map(w=>`<th>${w}</th>`).join("")}</tr>
   <tr><td class="lab">${bits?"bits":"brouillon"}</td>${row}</tr></table>${bits?"":`<p class="calc" style="margin-top:-4px">Brouillon : clique sur les cases pour t'aider (non noté)</p>`}</div>`;
}
function bindTab(root){
  const btn=root.querySelector(".tabbtn"); if(!btn) return;
  const wrap=root.querySelector(".tabwrap");
  btn.onclick=()=>{showTab=!showTab; wrap.hidden=!showTab; btn.textContent="📋 "+(showTab?"Masquer":"Afficher")+" le tableau de conversion";};
  root.querySelectorAll("td.scr").forEach(td=>td.onclick=()=>{td.classList.toggle("one");td.textContent=td.classList.contains("one")?"1":"0";});
}
const BRAVO=()=>["Bravo !","Super !","Exact !","Bien joué !","Parfait !"][Math.floor(Math.random()*5)];
function feedback(ok,q){
  const fb=document.getElementById("fb");
  if(ok){score++;fb.className="fb ok";fb.innerHTML=`<b>${BRAVO()}</b> ${q.ex}`;}
  else{rates.push(q);fb.className="fb ko";fb.innerHTML=`<b>Pas tout à fait…</b> La bonne réponse : <b style="color:var(--ok)">${q.a}</b>.<br>${q.ex}`;}
  document.querySelector(".stars").textContent="⭐ "+score;
  const n=document.getElementById("next");n.hidden=false;n.focus();
}
function answer(btn,q){
  const ok=btn.textContent===q.a;
  main.querySelectorAll(".ch").forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add("good");else if(b===btn)b.classList.add("bad");else b.classList.add("dim");});
  feedback(ok,q);
}
function answerClick(q,bs){
  const v=val(bs), ok=v===q.target;
  bs.forEach((b,i)=>{b.disabled=true;const want=!!(q.target&W[i]);const has=b.classList.contains("on");b.classList.add(want===has?"good":"bad");});
  document.getElementById("valider").remove();
  if(!ok) q=Object.assign({},q,{ex:`Tu as écrit ${v}. `+q.ex});
  feedback(ok,q);
}
function end(){
  saveBest(theme,score);
  const pct=score/serie.length;
  const msg=pct===1?"🏆 Parfait, tout est juste !":pct>=.8?"🎉 Très bien !":pct>=.5?"👍 C'est bien, continue !":"💪 Courage, réessaie : tu vas progresser !";
  const lib=q=>q.q+(q.big?` (${q.big})`:"")+(q.bigip?` (${q.bigip})`:"");
  main.innerHTML=`<div class="end">
   ${pct===1?'<div class="confetti">🎉🎊🎉</div>':""}
   <div class="big">${score} / ${serie.length}</div><p class="msg">${msg}</p>
   <p class="intro">Ton record pour ce thème : ${best(theme)} / ${N}</p>
   ${rates.length?`<div class="revoir"><h3>📌 À revoir</h3><ul>${rates.map(q=>`<li>${lib(q)} → <span>${q.a}</span></li>`).join("")}</ul></div>`:""}
   <div class="btns" style="justify-content:center"><button class="btn grey" id="h">⟵ Changer de thème</button><button class="btn blue" id="r">🔄 Rejouer ce thème</button></div></div>`;
  document.getElementById("h").onclick=home;
  document.getElementById("r").onclick=()=>start(theme);
}
function convertisseur(){
  main.innerHTML=`<div class="qcard"><p class="qtxt">🧮 L'atelier binaire</p>
   <p class="intro" style="margin:0 0 6px">Clique sur les bits pour voir le nombre en décimal, ou tape un nombre de 0 à 255 pour voir ses bits.</p>
   ${octetHTML("oa")}<div class="tot">En décimal : <span id="av">0</span></div><div class="calc" id="ac">Aucun bit à 1 → 0</div>
   <div class="atel-in"><label for="ai">Tape un nombre :</label><input id="ai" type="number" min="0" max="255" inputmode="numeric" placeholder="0–255"></div>
   <div class="fb ok" style="display:block"><b>Le savais-tu ?</b> Avec 8 bits, on a 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2 = 256 possibilités : de 0 (00000000) à 255 (11111111).</div></div>
   <div class="btns"><button class="btn grey" id="quit">⟵ Atelier</button><button class="btn blue" id="zero">Remettre à 0</button></div>`;
  const ai=document.getElementById("ai");
  const upd=v=>{document.getElementById("av").textContent=v;document.getElementById("ac").textContent=v?`${bin(v)} = ${decomp(v)} = ${v}`:"Aucun bit à 1 → 0";};
  const bs=bindOctet(document.getElementById("oa"),v=>{upd(v);ai.value=v;});
  ai.oninput=()=>{let v=parseInt(ai.value,10);if(isNaN(v)){return;}v=Math.max(0,Math.min(255,v));setOctet(bs,v);upd(v);};
  document.getElementById("zero").onclick=()=>{setOctet(bs,0);upd(0);ai.value="";};
  document.getElementById("quit").onclick=atelierMenu;
}
// ----- atelier : menu et défis -----
function rec(k){try{return +localStorage.getItem("reseau4e-defi-"+k)||0;}catch(e){return 0;}}
function setRec(k,v){try{if(v>rec(k))localStorage.setItem("reseau4e-defi-"+k,v);}catch(e){}}
const MODES={
  b2d:{t:"🎯 Binaire → décimal",d:"Lis l'octet et tape le nombre en décimal",cls:"th-bin",r:"Ta meilleure série"},
  d2b:{t:"🎯 Décimal → binaire",d:"Clique sur les bits pour écrire le nombre",cls:"th-peri",r:"Ta meilleure série"},
  chrono:{t:"⏱️ Contre-la-montre",d:"Un maximum de bonnes réponses en 60 secondes",cls:"th-all",r:"Ton record"}
};
function atelierMenu(){
  main.innerHTML=`<p class="intro">🧮 L'atelier binaire : entraîne-toi aux conversions. Plus tu enchaînes les bonnes réponses, plus les nombres deviennent grands !</p>
  <div class="themes">
   <button class="theme th-comp" data-m="conv"><span class="t">🔁 Convertisseur libre</span><span class="d">Clique sur les bits ou tape un nombre : vois la conversion en direct</span></button>
   ${Object.entries(MODES).map(([k,v])=>`<button class="theme ${v.cls}" data-m="${k}"><span class="t">${v.t}</span><span class="d">${v.d}</span><span class="best">${rec(k)?"⭐ "+v.r+" : "+rec(k):"Pas encore joué"}</span></button>`).join("")}
  </div><div class="btns"><button class="btn grey" id="quit">⟵ Thèmes</button></div>`;
  main.querySelectorAll(".theme").forEach(b=>b.onclick=()=>b.dataset.m==="conv"?convertisseur():defi(b.dataset.m));
  document.getElementById("quit").onclick=home;
}
const LEVELS=[{n:"Niveau 1",min:1,max:15},{n:"Niveau 2",min:16,max:63},{n:"Niveau 3",min:64,max:255}];
function defi(mode){
  let serieOK=0, total=0, ok=0, lv=0, timer=null, left=60, over=false; const used=new Set();
  const chrono=mode==="chrono";
  function stats(){return `<div class="dstat"><span class="lv">${LEVELS[lv].n}</span>${chrono?`<span class="ti" id="ti">⏱️ ${left} s</span><span class="st">✅ ${ok}</span>`:`<span class="st">🔥 Série : ${serieOK}</span><span>✅ ${ok} / ${total}</span>`}</div>`;}
  function newQ(){
    if(over) return;
    const L=LEVELS[lv], kind=chrono?(Math.random()<.5?"b2d":"d2b"):mode;
    let libres=[]; for(let x=L.min;x<=L.max;x++) if(!used.has(x)) libres.push(x);
    if(!libres.length){ for(let x=L.min;x<=L.max;x++) used.delete(x); for(let x=L.min;x<=L.max;x++) libres.push(x); }
    const n=libres[rnd(0,libres.length-1)]; used.add(n);
    let body;
    if(kind==="b2d") body=`<p class="qtxt">Quelle est la valeur en décimal ?</p><div class="bigbits">${bin(n)}</div>${convTab(bin(n))}
       <div class="atel-in"><input id="rep" type="number" min="0" max="255" inputmode="numeric" placeholder="?"><button class="btn blue" id="val">Valider</button></div>`;
    else body=`<p class="qtxt">Écris <span style="color:var(--teal)">${n}</span> en binaire.</p>${octetHTML("od")}<div class="tot">Ton octet vaut : <span id="dv">0</span></div>
       <div class="btns" style="justify-content:center"><button class="btn blue" id="val">Valider</button></div>`;
    main.innerHTML=`${stats()}<div class="qcard">${body}<div class="fb" id="fb"></div><div id="lvup"></div></div>
      <div class="btns"><button class="btn grey" id="quit">⟵ Atelier</button><button class="btn" id="next" hidden>Suivant ➜</button></div>`;
    document.getElementById("quit").onclick=()=>{over=true;clearInterval(timer);atelierMenu();};
    bindTab(main);
    let bs=null;
    if(kind==="d2b") bs=bindOctet(document.getElementById("od"),v=>document.getElementById("dv").textContent=v);
    const rep=document.getElementById("rep"); if(rep){rep.focus();rep.onkeydown=e=>{if(e.key==="Enter")check();};}
    document.getElementById("val").onclick=check;
    const nx=document.getElementById("next"); nx.onclick=newQ;
    function check(){
      if(over) return;
      let v;
      if(kind==="b2d"){ if(rep.value==="") return; v=parseInt(rep.value,10); rep.disabled=true; }
      else { v=val(bs); bs.forEach((b,i)=>{b.disabled=true;b.classList.add(!!(n&W[i])===b.classList.contains("on")?"good":"bad");}); }
      document.getElementById("val").remove();
      const good=v===n; total++;
      const fb=document.getElementById("fb");
      const exp=`${bin(n)} = ${decomp(n)} = ${n}`;
      if(good){ ok++; serieOK++; fb.className="fb ok"; fb.innerHTML=`<b>${BRAVO()}</b> ${exp}`; }
      else { serieOK=0; fb.className="fb ko"; fb.innerHTML=`<b>Pas tout à fait…</b> ${kind==="b2d"?"Tu as écrit "+v+". ":"Ton octet vaut "+v+". "}La bonne réponse : <b style="color:var(--ok)">${kind==="b2d"?n:bin(n)}</b>.<br>${exp}`; }
      if(!chrono) setRec(mode,serieOK);
      const before=lv;
      if(good && ok%5===0 && lv<LEVELS.length-1) lv++;
      if(!good && !chrono && lv>0 && total>=2) {} // on garde le niveau
      document.querySelector(".dstat").outerHTML=stats();
      if(lv>before) document.getElementById("lvup").innerHTML=`<div class="lvup">🚀 ${LEVELS[lv].n} débloqué : les nombres deviennent plus grands !</div>`;
      if(chrono){ setTimeout(newQ, good?700:1600); } else { nx.hidden=false; nx.focus(); }
    }
  }
  function fin(){
    over=true; clearInterval(timer); setRec("chrono",ok);
    main.innerHTML=`<div class="end"><p class="msg">⏱️ Temps écoulé !</p><div class="big">${ok}</div><p class="msg">bonne${ok>1?"s":""} réponse${ok>1?"s":""} en 60 secondes</p>
      <p class="intro">Ton record : ${rec("chrono")}</p>
      <div class="btns" style="justify-content:center"><button class="btn grey" id="h">⟵ Atelier</button><button class="btn blue" id="r">🔄 Rejouer</button></div></div>`;
    document.getElementById("h").onclick=atelierMenu; document.getElementById("r").onclick=()=>defi("chrono");
  }
  if(chrono){ timer=setInterval(()=>{left--; const t=document.getElementById("ti"); if(t) t.textContent="⏱️ "+left+" s"; if(left<=0) fin();},1000); }
  newQ();
}
home();
</script>
</body></html>
